apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-config
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
data:
  # Shared by both backend and frontend
  GEMINI_MODEL: {{ .Values.config.geminiModel | quote }}
  # Backend: fetch JWKS from frontend via internal K8s DNS
  FRONTEND_URL: {{ .Values.config.frontendUrl | quote }}
  # Frontend: Better Auth base URL (external ingress hostname)
  BETTER_AUTH_URL: {{ .Values.config.betterAuthUrl | quote }}
