apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-recurring
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: recurring-task-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recurring-task-service
  template:
    metadata:
      labels:
        app: recurring-task-service
        {{- include "todo-chatbot.labels" . | nindent 8 }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-recurring-task-service"
        dapr.io/app-port: "8002"
        dapr.io/log-level: "info"
    spec:
      containers:
        - name: recurring-task-service
          image: "{{ .Values.recurringTaskService.image.repository }}:{{ .Values.recurringTaskService.image.tag }}"
          imagePullPolicy: {{ .Values.recurringTaskService.image.pullPolicy }}
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: PUBSUB_NAME
              value: "kafka-pubsub"
            - name: BACKEND_APP_ID
              value: "todo-backend"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
