{{- if .Values.redpanda.enabled }}
# Local Dapr pub/sub: points to in-cluster Redpanda pod
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "redpanda:9092"
    - name: consumerGroup
      value: "todo-chatbot"
    - name: authRequired
      value: "false"
    - name: initialOffset
      value: "newest"
{{- end }}
